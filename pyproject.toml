[tool.poetry]
name = "cloud-risk-pipeline"
version = "0.1.0"
description = "Serverless batch processing quantitative risk engine on AWS ECS Fargate"
authors = ["James Beall"]
readme = "README.md"
packages = [{include = "risk_runner", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = "^2.0.35"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.3"
numpy = "^2.1.1"
pandas = "^2.2.2"
scipy = "^1.14.1"
boto3 = "^1.35.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-cov = "^5.0.0"
ruff = "^0.6.5"

[build-system]
requires = ["poetry-core>=2.0.0,<2.1.0"]
build-backend = "poetry.core.masonry.api"